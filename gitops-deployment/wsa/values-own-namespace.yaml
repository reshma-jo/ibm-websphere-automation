gitops:
  namespaceScoped: true

catalog:
  name: websphere-automation-catalog
  displayName: IBM WebSphere Automation Catalog
  image: icr.io/websphere-automation/cp/websphere-automation-operator-catalog:stable

cpfsCatalog:
  enabled: true
  name: ibm-cpfs-catalog
  displayName: ibm-cpfs-catalog
  image: icr.io/cpopen/ibm-common-service-catalog:4.19.2
  syncWave: "5"

pgCatalog:
  enabled: true
  name: ibm-pg-operator-catalog
  displayName: ibm-pg-operator-catalog
  image: icr.io/cpopen/ibm-pg-operator-catalog:v28.3.2
  syncWave: "5"

subscription:
  wsaOperatorNamespace: websphere-automation
  channel: v1.13
  installPlanApproval: Automatic
  wsaInstanceNamespace: websphere-automation

operatorNamespace: websphere-automation

commonServicesNamespace: websphere-automation

licensingNamespace: ibm-licensing

certManagerNamespace: ibm-cert-manager

wsaHealth:
  spec:
    license:
      accept: true

wsaSecure:
  spec:
    license:
      accept: true      

wsa:
  spec:
    commonServices:
      registryNamespace: websphere-automation
    license:
      accept: true
